name: Build Signed Coin Jump Adventure APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'coin-jump-adventure-unity-ads-fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Extract game project
        run: |
          mkdir -p project
          unzip -o coin-jump-adventure-unity-ads-fixed.zip -d project
          test -f project/app/build.gradle.kts

      - name: Prepare Amazon signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > project/my-upload-key.jks
          keytool -changealias \
            -alias "$ANDROID_KEY_ALIAS" \
            -destalias upload \
            -keystore project/my-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD"
          test -s project/my-upload-key.jks

      - name: Download Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/project/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          /tmp/gradle-9.3.1/bin/gradle -p project :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed APK
        run: |
          APK_PATH="$(find project/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-jump-adventure-signed-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
